<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rachel & Thibaut ❤️</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #111;
      color: white;
      text-align: center;
    }

    .page {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 30px 20px;
      box-sizing: border-box;
    }

    .coeur {
      font-size: 60px;
    }

    h1 {
      font-size: 40px;
      margin: 15px 0;
    }

    p {
      font-size: 19px;
      line-height: 1.5;
      max-width: 500px;
    }

    .spotify {
      width: 100%;
      max-width: 450px;
      margin-top: 25px;
    }

    iframe {
      border-radius: 12px;
    }
  </style>
</head>

<body>

<div class="page">

  <div class="coeur">❤️</div>

  <h1>Rachel & Thibaut</h1>

  <p>
    Si tu lis ça, c'est que tu as scanné
    un petit morceau de notre histoire.
  </p>

  <p>
    Une chanson, un souvenir, nous. ❤️
  </p>

  <div class="spotify">

    <iframe
      src="https://open.spotify.com/embed/track/2Ui2JtVjnbHZuExldryCOA"
      width="100%"
      height="152"
      frameborder="0"
      allowfullscreen=""
      allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"
      loading="lazy">
    </iframe>

  </div>

</div>

</body>
</html>
